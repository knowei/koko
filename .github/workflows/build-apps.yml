name: Build desktop and Android apps

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm test

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:installer

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: koko-windows-${{ github.sha }}
          path: dist-installer/*.exe
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm test

      - name: Sync web assets to Android
        run: npm run mobile:sync

      - name: Configure Android release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/koko-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=app/koko-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: koko-android-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows-installer
      - android-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v5
        with:
          pattern: koko-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*.exe
          release-assets/*.apk
          --repo "${GITHUB_REPOSITORY}"
          --title "可可 ${GITHUB_REF_NAME}"
          --generate-notes
